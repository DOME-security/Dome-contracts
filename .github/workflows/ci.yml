name: CI

on:
  push:
    branches: [main]
  pull_request:

# Nothing here writes to the repo, so the token is read-only.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  STELLAR_CLI_VERSION: v28.1.0

jobs:
  hygiene:
    name: Repo hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Reject auto-run files, secrets and install scripts
        run: |
          fail=0
          if git ls-files | grep -E '(^|/)\.vscode/tasks\.json$'; then
            echo "::error::.vscode/tasks.json is not allowed in this repo"; fail=1
          fi
          if git ls-files | grep -E '(^|/)\.env(\..*)?$|(^|/)\.stellar/|(^|/)identity/.*\.toml$|\.key$'; then
            echo "::error::secrets, .env or Stellar identity files are committed"; fail=1
          fi
          # Test grep's output, not xargs' status: with no package.json at
          # all, xargs -r runs nothing and still exits 0.
          scripts="$(git ls-files -z '*package.json' | xargs -0 -r grep -lE '"(preinstall|install|postinstall|prepare)"[[:space:]]*:' || true)"
          if [[ -n "$scripts" ]]; then
            echo "$scripts"
            echo "::error::npm install lifecycle scripts are not allowed"; fail=1
          fi
          exit $fail
      - name: Shellcheck
        run: shellcheck scripts/*.sh

  rust:
    name: Lint and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install toolchain from rust-toolchain.toml
        run: rustup toolchain install
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
      - run: make lint
      - run: make test

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Prebuilt cargo-audit, checksum-verified by the action.
      - uses: taiki-e/install-action@1168f6810a3cb30a3514bf5756a3b7f0422c6df8 # v2.87.28
        with:
          tool: cargo-audit@0.22.2
      # Ignored advisories, each with a reason, are in .cargo/audit.toml.
      - run: cargo audit

  wasm:
    name: Build Wasm and check bindings
    runs-on: ubuntu-latest
    needs: rust
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install toolchain from rust-toolchain.toml
        run: rustup toolchain install
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-wasm-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
      # The action reads its version from the ref, which is a SHA here, so
      # the version is passed explicitly.
      - uses: stellar/stellar-cli@c0f4d0da891bbf214c08b8c5035ae6db80e9a3bd # v28.1.0
        with:
          version: ${{ env.STELLAR_CLI_VERSION }}
      # The bindings generator in tools/bindgen needs Node 22.12+.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      # Includes the upgrade test, the resource budgets and the 32 KiB Wasm
      # size limit, which all need the built Wasm.
      - name: Build and run all tests against the Wasm
        run: make test-wasm
      - name: Report Wasm size and hash
        run: |
          wasm=target/wasm32v1-none/release/dome_registry.wasm
          echo "### Wasm" >> "$GITHUB_STEP_SUMMARY"
          echo "size: $(stat -c %s "$wasm") bytes (limit 32768)" >> "$GITHUB_STEP_SUMMARY"
          echo "sha256: $(sha256sum "$wasm" | cut -d' ' -f1)" >> "$GITHUB_STEP_SUMMARY"
      - name: Check committed bindings are current
        if: hashFiles('bindings/ts/package.json') != ''
        run: ./scripts/bindings.sh --check
      - name: Generate bindings for review
        if: hashFiles('bindings/ts/package.json') == ''
        run: ./scripts/bindings.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dome-registry
          path: |
            target/wasm32v1-none/release/dome_registry.wasm
            bindings/ts
          if-no-files-found: error
